<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>满分男友测评</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="assets/crayon.css">
<link rel="stylesheet" href="assets/boyfriend.css">
</head>
<body data-theme="boyfriend">
<main class="wrap">

  <section id="s-start">

      <h1 id="title"></h1>
      <p class="lede" id="intro"></p>

      <div class="meta">

        <span>约 6 分钟</span>
        <span>答案她说了算</span>
      </div>

    <div class="card">
      <span class="tape"></span>

      </div>
      <p class="lede" id="startNote"></p>
      <button class="btn" id="start"><span id="startLabel"></span> ♡</button>
    </div>
  </section>

  <section id="s-quiz" class="hidden">
    <div class="card">
      <span class="tape tl"></span>
      <div class="progress">
        <span class="num" id="pnum"></span>
        <span class="bar"><i class="fill" id="pfill" style="width:3%"></i></span>
      </div>
      <div>
        <span class="qtag" id="qtag"></span>
        <span class="qhint hidden" id="qhint">可多选</span>
      </div>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn prev" id="prevBtn">← 上一题</button>
        <button class="btn" id="nextBtn"><span class="lbl">下一题</span> →</button>
      </div>
    </div>
  </section>

  <section id="s-result" class="hidden">
    <div class="card">
      <span class="tape tr"></span>
      <div class="doodles" aria-hidden="true">
        <svg class="dd dd-sparkle2" viewBox="0 0 64 64"><path d="M32 4 C33.6 14 36 17 46 18.6 C35.4 20.4 33.2 23.4 31.6 34 C30 23.6 27.8 20.4 17 18.8 C27.6 17 30 14 32 4 Z" fill="rgba(142,217,192,.62)" stroke="rgba(70,150,130,.88)" stroke-width="1.8" stroke-linejoin="round"/></svg>

        <div class="plate" id="plate"></div>
        <span class="rcode" id="rcode"></span>
        <div class="rname" id="rname"></div>
        <div class="rtag" id="rtag"></div>
        <div class="score">
          <div><span class="num" id="scorenum">0</span><span class="unit"> 分</span></div>
          <div class="sub" id="scoresub"></div>
        </div>
      </div>
      <p class="portrait" id="portrait"></p>
      <div class="detail" id="rdetail"></div>
      <div class="redblock hidden" id="rred"></div>
      <div class="quote" id="rquote"></div>
      <p class="disclaim" id="disclaimer"></p>
      <button class="btn ghost" id="again">↺ 再测一次</button>
    </div>
  </section>

  <div class="footer">图鉴系列 · 满分男友测评<br>趣味小测 · 别太当真 ♡</div>
</main>
